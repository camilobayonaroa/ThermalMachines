       -5.36943681e-12, -8906.25182, 41.669727]
    - [26.510423, 0.0301796816, -5.82184988e-06, 1.42085775e-11,
       7.60110768e-14, -1.80373025e+04, -114.981197]

- name: C8H16
  composition: {C: 8, H: 16}
  thermo:
    model: NASA7
    temperature-ranges: [300.0, 1400.0, 3500.0]
    data:
