description: |-
  Reduced iso-octane mechanism prepared for the Wankel 13B validation model.

  IMPORTANT:
  This is NOT the complete Z153 mechanism. It combines the published
  Z153 high-temperature iso-octane branch (IC8H18 / C8H17 / C8H16)
  with the standard GRI-Mech 3.0 small-species chemistry distributed
  with Cantera.

  It is intended to provide a clean, loadable mechanism for initial
  model validation. For thesis-quality detailed iso-octane chemistry,
  replace this file later with the complete Z153 or LLNL mechanism.

generator: ChatGPT
input-files: [gri30.yaml]
cantera-version: 3.2-compatible

units:
  length: cm
  quantity: mol
  activation-energy: cal/mol

phases:
- name: gas
  thermo: ideal-gas
  elements: [H, O, C, N, Ar]
  species:
  - gri30.yaml/species: all
  - species: [IC8H18, C8H17, C8H16]
  kinetics: gas
  reactions:
  - gri30.yaml/reactions: all
  - isooctane-reactions: all
  state:
    T: 300.0
    P: 1.01325e+05

species:

- name: IC8H18
  composition: {C: 8, H: 18}
  thermo:
    model: NASA7
    temperature-ranges: [300.0, 1390.0, 3500.0]
    data:
    - [-5.96912082, 0.12087217, -9.61538218e-05, 4.1348929e-08,
       -7.18982937e-12, -3.02675122e+04, 52.7954202]
    - [20.6155885, 0.0443694094, -1.35968858e-05, 1.75327621e-09,
       -6.83090867e-14, -3.76580614e+04, -84.2148794]

- name: C8H17
  composition: {C: 8, H: 17}
  thermo:
