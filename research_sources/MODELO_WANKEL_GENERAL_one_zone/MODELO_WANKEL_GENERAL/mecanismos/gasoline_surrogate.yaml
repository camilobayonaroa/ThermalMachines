       -6.36990286e-12, -1.56875145e+04, 51.1323812]
    - [18.8616063, 0.0414292819, -1.28170543e-05, 1.66806735e-09,
       -6.58961701e-14, -2.24684067e+04, -73.8514297]

isooctane-reactions:

# Z153 reaction 37
- equation: IC8H18 + O2 => C8H17 + HO2
  rate-constant: {A: 2.0e+15, b: 0.0, Ea: 5.015e+04}

# Z153 reaction 38
- equation: IC8H18 + OH => C8H17 + H2O
  rate-constant: {A: 3.0e+07, b: 1.85, Ea: 58.5}

# Z153 reaction 39
- equation: IC8H18 + H => C8H17 + H2
  rate-constant: {A: 2.0e+08, b: 2.0, Ea: 2500.0}

# Z153 reaction 40
- equation: IC8H18 + HO2 => C8H17 + H2O2
  rate-constant: {A: 2.12e+14, b: 0.0, Ea: 1.769e+04}

# Z153 reaction 46
- equation: C8H17 + O2 => C8H16 + HO2
  rate-constant: {A: 3.16e+11, b: 0.0, Ea: 6000.0}

